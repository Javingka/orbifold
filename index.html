<!doctype html>
<!--
  SPDX-License-Identifier: AGPL-3.0-only

  ꩜ Orbifold — composición por geometría musical + Strudel + agente IA
  Interfaz basada en "The Geometry of Musical Chords" (Dmitri Tymoczko):
  los acordes son puntos en un orbifold (Tonnetz) y los voice-leadings son
  los caminos que trazas entre ellos. Los ritmos cíclicos viven en el mismo
  espacio: órbitas circulares.

  Strudel es AGPL-3.0. Si distribuyes esta app, debe ir bajo AGPL-3.0.
  https://www.gnu.org/licenses/agpl-3.0.en.html

  Built with Vite + TypeScript + Svelte + PixiJS v7.
  Dependencies come from npm — no CDN script tags.
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Orbifold — geometría sonora</title>
    <!-- Fonts: Fraunces (serif labels), Albert Sans (sans UI), IBM Plex Mono (code/rhythm) -->
    <!-- OD-2 resolution: <link> tags in index.html, same approach as prototype <style>@import</style> -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Albert+Sans:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <!-- First-visit redirect: send new users to the landing page. -->
    <!-- ?enter=1 is set by landing "Entrar" buttons — marks the user as visited. -->
    <!-- Skip redirect for share URLs (#session=...) and ?enter=1 arrivals. -->
    <script>
      if (location.search.includes('enter=1')) {
        localStorage.setItem('orbifold.visited', '1');
        history.replaceState(null, '', location.pathname + location.hash);
      } else if (!localStorage.getItem('orbifold.visited') && !location.hash.startsWith('#session=')) {
        location.replace('./landing.html');
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
